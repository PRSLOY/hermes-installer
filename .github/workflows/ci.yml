name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        # Windows PowerShell 5.1, like the product: under the runner's default pwsh 7,
        # child powershell.exe inherits pwsh module paths and cannot even load Get-FileHash.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml httpx certifi websockets python-dotenv
      - name: Backend tests
        run: python -m pytest tests/backend -q
      - name: Clean package build
        run: python -m pytest tests/test_clean_package.py -q
